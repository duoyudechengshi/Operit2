name: Linux Release Build

on:
  workflow_dispatch:
    inputs:
      products:
        description: "Release products to build"
        required: false
        default: "all"
        type: choice
        options:
          - "app"
          - "cli"
          - "all"
      cli_arches:
        description: "Linux CLI architectures"
        required: false
        default: "all"
        type: choice
        options:
          - "host"
          - "all"
          - "x86_64"
          - "aarch64"

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUSTFLAGS: -Awarnings
      RUST_TOOLCHAIN_VERSION: 1.95.0
      FVM_VERSION: 4.3.0
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      OPERIT_MNN_SOURCE: ${{ github.workspace }}/.ci-sources/mnn/MNN-3.6.1
      OPERIT_LLAMA_SOURCE: ${{ github.workspace }}/.ci-sources/llama/llama.cpp-b11829

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            gcc-aarch64-linux-gnu \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer1.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            liblzma-dev \
            libwebkit2gtk-4.1-dev \
            libc6-dev-arm64-cross \
            musl-tools \
            ninja-build \
            pkg-config

      - name: Install bootstrap Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install FVM
        run: |
          dart pub global activate fvm "$FVM_VERSION"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install project Flutter SDK
        working-directory: apps/flutter/app
        run: fvm install --skip-pub-get

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-gnu

      - name: Prepare Python venv for Flutter build hook
        run: |
          python3 -m venv .venv
          .venv/bin/python --version

      - name: Prepare TypeScript toolchain for plugin sync
        run: npm install --prefix .ci-tools/typescript --no-audit --no-fund typescript@5.9.3

      - name: Enable corepack (put pnpm on PATH)
        run: |
          corepack enable
          corepack prepare pnpm@10.7.0 --activate
          pnpm --version

      - name: Install plugin workflow dependencies (pnpm)
        run: |
          cd plugins/packages/buildin/workflow
          corepack pnpm install --frozen-lockfile

      - name: Check build environment
        run: python3 tools/build_scripts/check_build_environment.py --products "${{ inputs.products }}" --cli-arches "${{ inputs.cli_arches }}" --github-runner

      - name: Build and package Linux app
        if: inputs.products != 'cli'
        run: python3 tools/build_scripts/build_flutter_linux.py --enforce-lockfile

      - name: Pre-extract MNN and llama.cpp sources (locale-independent)
        run: |
          set -e
          mkdir -p .ci-sources/mnn .ci-sources/llama
          curl -sSL -o /tmp/mnn.zip https://codeload.github.com/alibaba/MNN/zip/refs/tags/3.6.1
          curl -sSL -o /tmp/llama.zip https://codeload.github.com/ggml-org/llama.cpp/zip/refs/tags/b11829
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/mnn.zip').extractall('.ci-sources/mnn'); zipfile.ZipFile('/tmp/llama.zip').extractall('.ci-sources/llama'); print('extracted')"
          ls -d .ci-sources/mnn/* .ci-sources/llama/*

      - name: Build and package Linux CLI
        if: inputs.products != 'app'
        run: python3 tools/build_scripts/build_cli_linux.py --arches "${{ inputs.cli_arches }}"

      - name: Upload Linux app artifact
        if: inputs.products != 'cli'
        uses: actions/upload-artifact@v4
        with:
          name: operit2-linux-app-${{ github.sha }}
          path: tools/release/dist/operit2-app-linux-x86_64-*.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux CLI artifacts
        if: inputs.products != 'app'
        uses: actions/upload-artifact@v4
        with:
          name: operit2-linux-cli-${{ github.sha }}
          path: tools/release/dist/operit2-cli-linux-*.tar.gz
          if-no-files-found: error
          retention-days: 14
